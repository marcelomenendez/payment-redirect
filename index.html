<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f8fafc;
            color: #333;
        }
        .error-message {
            color: #dc2626;
            font-size: 1.1rem;
            font-weight: 500;
            padding: 1rem 1.5rem;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 8px;
        }
    </style>
</head>
<body>
<div id="content"></div>

<script>
    const params = new URLSearchParams(window.location.search);
    const requestId = params.get('requestID') || params.get('requestId');

    if (!requestId) {
        document.getElementById('content').innerHTML = 
            '<p class="error-message">No se ha recibido requestID</p>';
    } else {
        window.parent.postMessage({
            type: 'PAYMENT_COMPLETED',
            requestId: requestId,
            url: window.location.href
        }, '*');
    }
</script>
</body>
</html>
