<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espere ...</title>
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            color: #172a33;
        }

        .loading {
            display: grid;
            justify-items: center;
            gap: 1.75rem;
            transform: translateY(-3rem);
        }

        .spinner {
            width: 3rem;
            height: 3rem;
            border: 0.3rem solid #e1e5e8;
            border-top-color: #0b5d1e;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .message {
            padding: 0.75rem 1.25rem;
            border: 2px solid;
            border-radius: 0.5rem;
            font-weight: bold;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .message.ok {
            color: #0b5d1e;
            border-color: #0b5d1e;
        }

        .message.error {
            color: #b00020;
            border-color: #b00020;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            .spinner {
                animation: none;
            }
        }

        .copy-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            margin-left: 0.3rem;
            font-size: 1.3rem;
            opacity: 1;
            transition: opacity 0.2s;
            vertical-align: baseline;
            display: inline-flex;
            align-items: center;
            color: #000;
            position: relative;
        }

        .copy-btn:hover {
            opacity: 1;
            color: #1a1a1a;
        }

        .copy-notification {
            position: absolute;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            background: #000;
            color: #fff;
            padding: 0.5rem 0.75rem;
            border-radius: 0.25rem;
            font-size: 0.875rem;
            font-weight: normal;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            animation: fadeInOut 1s ease-in-out;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>
    <main class="loading" role="status">
        <div class="spinner" id="spinner" aria-hidden="true"></div>
        <div id="request-info" class="message">
            <div id="content-container"></div>
        </div>
    </main>
    <script>
        const requestId = new URLSearchParams(window.location.search).get("requestID");
        const info = document.getElementById("request-info");
        const contentContainer = document.getElementById("content-container");

        if (requestId) {
            info.classList.add("ok");
            contentContainer.innerHTML = `
                <div style="display: flex; flex-direction: column; align-items: center; gap: 0.75rem;">
                    <div>Esperando confirmación</div>
                    <div style="display: flex; align-items: flex-start; gap: 0.3rem; padding-top: 0.1rem;">
                        <span>requestID: <span>${requestId}</span></span>
                        <button id="copy-btn" class="copy-btn" title="Copiar al portapapeles" style="margin-top: -0.075rem; color: #000; opacity: 1;">
                            <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                <rect x="2" y="6" width="12" height="12" rx="1" ry="1"></rect>
                                <rect x="6" y="3" width="12" height="12" rx="1" ry="1"></rect>
                            </svg>
                        </button>
                    </div>
                </div>
            `;
            
            const copyBtn = document.getElementById("copy-btn");
            copyBtn.addEventListener("click", async () => {
                try {
                    await navigator.clipboard.writeText(requestId);
                    const notification = document.createElement("div");
                    notification.className = "copy-notification";
                    notification.textContent = "requestID copiado";
                    copyBtn.appendChild(notification);
                    setTimeout(() => {
                        notification.remove();
                    }, 1000);
                } catch (err) {
                    console.error("Error al copiar:", err);
                }
            });
        } else {
            info.classList.add("error");
            document.getElementById("spinner").hidden = true;
            contentContainer.textContent = "No se ha recibido el parámetro requestID";
        }
    </script>
</body>
</html>
