<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espere ...</title>
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            color: #172a33;
        }

        .loading {
            display: grid;
            justify-items: center;
            gap: 1.75rem;
            transform: translateY(-3rem);
        }

        .spinner {
            width: 3rem;
            height: 3rem;
            border: 0.3rem solid #e1e5e8;
            border-top-color: #0b5d1e;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .message {
            padding: 0.75rem 1.25rem;
            border: 2px solid;
            border-radius: 0.5rem;
            font-weight: bold;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .message.ok {
            color: #0b5d1e;
            border-color: #0b5d1e;
        }

        .message.error {
            color: #b00020;
            border-color: #b00020;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            .spinner {
                animation: none;
            }
        }

    </style>
</head>
<body>
    <main class="loading" role="status">
        <div class="spinner" id="spinner" aria-hidden="true"></div>
        <div id="request-info" class="message">
            <div id="content-container"></div>
        </div>
    </main>
    <script>
        const requestId = new URLSearchParams(window.location.search).get("requestID");
        const info = document.getElementById("request-info");
        const contentContainer = document.getElementById("content-container");

        if (requestId) {
            info.classList.add("ok");
            contentContainer.innerHTML = `
                <div style="display: flex; flex-direction: column; align-items: center; gap: 0.75rem;">
                    <div>Esperando confirmación</div>
                    <div style="display: flex; align-items: flex-start; gap: 0.3rem; padding-top: 0.1rem;">
                        <span>requestID: <span>${requestId}</span></span>
                    </div>
                </div>
            `;
        } else {
            info.classList.add("error");
            document.getElementById("spinner").hidden = true;
            contentContainer.textContent = "No se ha recibido el parámetro requestID";
        }
    </script>
</body>
</html>
